syntax = "proto3";

package product;

service ProductService {
  rpc ListProducts (Empty) returns (ProductListResponse);
  rpc GetProduct (GetProductRequest) returns (ProductInfo);
  rpc CreateProduct (CreateProductRequest) returns (ProductInfo);
  rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductResponse);
  rpc UpdateInventory (UpdateInventoryRequest) returns (ProductInfo);
  rpc DeleteProduct (GetProductRequest) returns (DeleteProductResponse);
  rpc ReserveInventory (ReserveInventoryRequest) returns (ReserveInventoryResponse);
  rpc ReleaseInventory (ReserveInventoryRequest) returns (ReleaseInventoryResponse);
  rpc HealthCheck (Empty) returns (HealthResponse);
}

message Empty {}

message HealthResponse {
  string status = 1;
  string service = 2;
}

message GetProductRequest {
  int32 pid = 1;
}

message CreateProductRequest {
  string pname = 1;
  double price = 2;
  int32 quantity = 3;
}

message UpdateProductRequest {
  int32 pid = 1;
  string pname = 2;
  double price = 3;
  int32 quantity = 4;
  bool has_price = 5;
  bool has_quantity = 6;
}

message UpdateInventoryRequest {
  int32 pid = 1;
  int32 quantity = 2;
}

message ProductInfo {
  int32 pid = 1;
  string pname = 2;
  double price = 3;
  int32 quantity = 4;
}

message ProductListResponse {
  repeated ProductInfo items = 1;
}

message UpdateProductResponse {
  string message = 1;
  int32 pid = 2;
  ProductInfo product = 3;
}

message DeleteProductResponse {
  string message = 1;
  int32 pid = 2;
}

message OrderItemInput {
  int32 pid = 1;
  int32 qty = 2;
}

message ReserveInventoryRequest {
  repeated OrderItemInput items = 1;
}

message ReservedProductItem {
  int32 pid = 1;
  string pname = 2;
  int32 qty = 3;
  double unit_price = 4;
  int32 remaining_quantity = 5;
}

message ReserveInventoryResponse {
  bool success = 1;
  repeated ReservedProductItem items = 2;
}

message ReleaseInventoryResponse {
  bool success = 1;
}

