syntax = "proto3";

package customer;

service CustomerService {
  rpc CreateCustomer (CreateCustomerRequest) returns (CustomerResponse);
  rpc GetCustomer (GetCustomerRequest) returns (CustomerResponse);
  rpc UpdateCustomer (UpdateCustomerRequest) returns (UpdateCustomerResponse);
  rpc GetCustomerScore (GetCustomerRequest) returns (CustomerScoreResponse);
  rpc ListMemberships (Empty) returns (MembershipListResponse);
  rpc GetMembership (GetMembershipRequest) returns (MembershipInfo);
  rpc CreateMembership (CreateMembershipRequest) returns (MembershipInfo);
  rpc UpdateMembership (UpdateMembershipRequest) returns (MembershipInfo);
  rpc HealthCheck (Empty) returns (HealthResponse);
}

message Empty {}

message HealthResponse {
  string status = 1;
  string service = 2;
}

message CreateCustomerRequest {
  int32 uid = 1;
  string fullname = 2;
  int32 mid = 3;
}

message GetCustomerRequest {
  int32 uid = 1;
}

message UpdateCustomerRequest {
  int32 uid = 1;
  string fullname = 2;
  int32 mid = 3;
}

message CustomerResponse {
  int32 uid = 1;
  string fullname = 2;
  int32 mid = 3;
  string mname = 4;
  int32 score = 5;
}

message UpdateCustomerResponse {
  string message = 1;
  int32 uid = 2;
  string fullname = 3;
  int32 mid = 4;
  string mname = 5;
  int32 score = 6;
}

message CustomerScoreResponse {
  int32 uid = 1;
  int32 mid = 2;
  string mname = 3;
  int32 score = 4;
}

message GetMembershipRequest {
  int32 mid = 1;
}

message CreateMembershipRequest {
  string mname = 1;
  int32 score = 2;
}

message UpdateMembershipRequest {
  int32 mid = 1;
  string mname = 2;
  int32 score = 3;
}

message MembershipInfo {
  int32 mid = 1;
  string mname = 2;
  int32 score = 3;
}

message MembershipListResponse {
  repeated MembershipInfo items = 1;
}

