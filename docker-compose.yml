services:
  # ===========================================================================
  # 1. API GATEWAY & REDIS (CACHE + RATE LIMITING)
  # ===========================================================================
  redis-gateway:
    image: redis:7-alpine
    container_name: redis-gateway
    ports:
      - "6379:6379"
    volumes:
      - redis_gateway_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      GATEWAY_PORT: 3000
      REDIS_URL: redis://redis-gateway:6379
      JWT_SECRET: ${JWT_SECRET:-ecommerce-mvp-super-secret-jwt-key-2026}
      RATE_LIMIT_WINDOW_SEC: 60
      RATE_LIMIT_MAX_REQUESTS: 100
      CACHE_TTL_SEC: 60
      AUTH_SERVICE_URL: auth-service:50051
      CUSTOMER_SERVICE_URL: customer-service:50052
      PRODUCT_SERVICE_URL: product-service:50053
      ORDER_SERVICE_URL: order-service:50054
      SHIPMENT_SERVICE_URL: shipment-service:50055
    depends_on:
      redis-gateway:
        condition: service_healthy
      auth-service:
        condition: service_started
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      shipment-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - ecommerce-net

  # ===========================================================================
  # 2. IDENTITY & ACCESS BOUNDED CONTEXT (Auth Service + PostgreSQL)
  # ===========================================================================
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "50051:50051"
    environment:
      AUTH_GRPC_PORT: 50051
      AUTH_DATABASE_URL: postgresql://postgres:postgres@postgres-auth:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-ecommerce-mvp-super-secret-jwt-key-2026}
      JWT_EXPIRES_IN: 3600
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecommerce-net

  # ===========================================================================
  # 3. CUSTOMER & MEMBERSHIP BOUNDED CONTEXT (Customer Service + PostgreSQL)
  # ===========================================================================
  postgres-customer:
    image: postgres:16-alpine
    container_name: postgres-customer
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_customer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: customer-service
    ports:
      - "50052:50052"
    environment:
      CUSTOMER_GRPC_PORT: 50052
      CUSTOMER_DATABASE_URL: postgresql://postgres:postgres@postgres-customer:5432/customer_db
    depends_on:
      postgres-customer:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecommerce-net

  # ===========================================================================
  # 4. PRODUCT CATALOG BOUNDED CONTEXT (Product Service + MongoDB)
  # ===========================================================================
  mongo-product:
    image: mongo:7
    container_name: mongo-product
    ports:
      - "27018:27017"
    volumes:
      - mongo_product_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    ports:
      - "50053:50053"
    environment:
      PRODUCT_GRPC_PORT: 50053
      PRODUCT_MONGO_URI: mongodb://mongo-product:27017/product_db
    depends_on:
      mongo-product:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecommerce-net

  # ===========================================================================
  # 5. MESSAGE BROKER LAYER (Apache Kafka - KRaft Mode)
  # ===========================================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    networks:
      - ecommerce-net

  # ===========================================================================
  # 6. ORDER MANAGEMENT BOUNDED CONTEXT (Order Service + PostgreSQL + Kafka)
  # ===========================================================================
  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    ports:
      - "50054:50054"
    environment:
      ORDER_GRPC_PORT: 50054
      ORDER_DATABASE_URL: postgresql://postgres:postgres@postgres-order:5432/order_db
      CUSTOMER_SERVICE_URL: customer-service:50052
      PRODUCT_SERVICE_URL: product-service:50053
      KAFKA_BROKERS: kafka:29092
      KAFKA_ORDER_TOPIC: order-created
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - ecommerce-net

  # ===========================================================================
  # 7. SHIPMENT BOUNDED CONTEXT (Shipment Service + MongoDB + Kafka)
  # ===========================================================================
  mongo-shipment:
    image: mongo:7
    container_name: mongo-shipment
    ports:
      - "27019:27017"
    volumes:
      - mongo_shipment_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  shipment-service:
    build:
      context: .
      dockerfile: services/shipment-service/Dockerfile
    container_name: shipment-service
    ports:
      - "50055:50055"
    environment:
      SHIPMENT_GRPC_PORT: 50055
      SHIPMENT_MONGO_URI: mongodb://mongo-shipment:27017/shipment_db
      KAFKA_BROKERS: kafka:29092
      KAFKA_ORDER_TOPIC: order-created
    depends_on:
      mongo-shipment:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge

volumes:
  redis_gateway_data:
  postgres_auth_data:
  postgres_customer_data:
  postgres_order_data:
  mongo_product_data:
  mongo_shipment_data:

